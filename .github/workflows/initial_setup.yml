name: Initial Template Setup

on:
  push:
    branches: [main]

permissions:
  contents: write # Grant write access to push the renamed files back

jobs:
  run-setup:
    # Single source of truth for the self-identity guard: skip on the template
    # repo itself, run only in repos created from it. If the template is ever
    # renamed on GitHub, update THIS ONE line.
    if: github.event.repository.name != 'python_env_devcontainer_template'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize template
        run: |
          if [ ! -f run_me_first.sh ]; then
            echo "Template already initialized; nothing to do."
            exit 0
          fi
          bash ./run_me_first.sh           # renames placeholder, deletes itself
          rm -f .github/workflows/initial_setup.yml

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initialize repository from template" || echo "Nothing to commit"
          git push origin main
